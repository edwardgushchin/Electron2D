name: Private native package

on:
  workflow_call:
    inputs:
      rebuild:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild native libraries without using the CI cache
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cross_matrix:
    runs-on: ubuntu-24.04
    outputs:
      rids: ${{ steps.matrix.outputs.rids }}
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python3 -B tools/native/test_package.py
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          rows = json.loads(Path('tools/ci/rids.json').read_text())
          platforms = ('Android', 'iOS', 'tvOS', 'Web')
          print('rids=' + json.dumps({'include': [row for row in rows if row['platform'] in platforms]}))
          print('packages=' + json.dumps({'include': [{'platform': name, 'runner': 'macos-26' if name in ('iOS', 'tvOS') else 'ubuntu-24.04'} for name in platforms]}))
          PY
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native build prerequisites
        run: |
          apt-get update
          apt-get install -y git python3 ca-certificates curl build-essential cmake ninja-build pkg-config zlib1g-dev libzstd-dev libicu70 libssl3
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore the pinned native SDL package
        run: dotnet restore Electron2D.csproj -r "${{ matrix.rid }}" -p:Electron2DBuildNativeFromSource=true
      - id: recipe
        run: echo "hash=$(python3 -B tools/native/package.py fingerprint)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: native_cache
        if: ${{ !inputs.rebuild }}
        with:
          path: bin/native-artifacts/
          key: native-${{ matrix.rid }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.recipe.outputs.hash }}
      - name: Build and audit private native libraries
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: >-
          dotnet msbuild Electron2D.csproj -t:BuildElectron2DNativeAssets
          -p:RuntimeIdentifier=${{ matrix.rid }} -p:Configuration=Release
          -p:Electron2DBuildNativeFromSource=true -p:Electron2DTextNativeJobs=2
          -p:Electron2DAudioNativeJobs=2 -p:Electron2DENetNativeJobs=2
      - name: Validate current source receipts and binary identities
        run: python3 -B tools/native/package.py check bin/native-artifacts --rids "${{ matrix.rid }}" --platform Linux
      - uses: actions/upload-artifact@v4
        with:
          name: private-native-${{ matrix.rid }}
          path: bin/native-artifacts/
          if-no-files-found: error
  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: private-native-linux-*
          merge-multiple: true
          path: bin/native-artifacts/
      - name: Pack both native architectures
        run: |
          python3 -B tools/native/test_package.py
          dotnet pack tools/native/Native.csproj -c Release -o bin/native-feed
      - uses: actions/upload-artifact@v4
        with:
          name: private-native-package
          path: bin/native-feed/*.nupkg
          if-no-files-found: error
  native_macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            runner: macos-26-intel
          - rid: osx-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore the pinned native SDL package
        run: dotnet restore Electron2D.csproj -r "${{ matrix.rid }}" -p:Electron2DBuildNativeFromSource=true
      - id: recipe
        run: echo "hash=$(python3 -B tools/native/package.py fingerprint)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: native_cache
        if: ${{ !inputs.rebuild }}
        with:
          path: bin/native-artifacts/
          key: native-${{ matrix.rid }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.recipe.outputs.hash }}
      - name: Build and audit matching macOS libraries
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: >-
          dotnet msbuild Electron2D.csproj -t:BuildElectron2DNativeAssets
          -p:RuntimeIdentifier=${{ matrix.rid }} -p:Configuration=Release
          -p:Electron2DBuildNativeFromSource=true -p:Electron2DTextNativeJobs=2
          -p:Electron2DAudioNativeJobs=2 -p:Electron2DENetNativeJobs=2
      - name: Validate current source receipts and binary identities
        run: python3 -B tools/native/package.py check bin/native-artifacts --rids "${{ matrix.rid }}" --platform MacOS
      - uses: actions/upload-artifact@v4
        with:
          name: private-native-MacOS-${{ matrix.rid }}
          path: bin/native-artifacts/
          if-no-files-found: error
  package_macos:
    needs: native_macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: private-native-MacOS-*
          merge-multiple: true
          path: bin/native-artifacts/
      - name: Pack both macOS native architectures
        run: dotnet pack tools/native/Native.csproj -c Release -p:NativePackagePlatform=MacOS -o bin/native-feed
      - uses: actions/upload-artifact@v4
        with:
          name: private-native-package-macos
          path: bin/native-feed/*.nupkg
          if-no-files-found: error
  native_windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            arch: x86
            runner: windows-2025
          - rid: win-x64
            arch: x64
            runner: windows-2025
          - rid: win-arm64
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: ${{ matrix.arch }}
      - name: Install pinned PE audit dependency
        run: python -m pip install --require-hashes -r tools/native/requirements-windows.txt
      - name: Restore the pinned native SDL package
        run: dotnet restore Electron2D.csproj -r "${{ matrix.rid }}" -p:Electron2DBuildNativeFromSource=true
      - id: recipe
        run: echo "hash=$(python -B tools/native/package.py fingerprint)" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/cache@v4
        id: native_cache
        if: ${{ !inputs.rebuild }}
        with:
          path: bin/native-artifacts/
          key: native-${{ matrix.rid }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.recipe.outputs.hash }}
      - name: Build and audit selected Windows libraries
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: |
          $packages = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $HOME '.nuget/packages' }
          $sdl = Join-Path $packages 'sdl3-cs.windows/3.4.18/runtimes/${{ matrix.rid }}/native/SDL3.dll'
          python -B tools/native/build_windows.py '${{ matrix.rid }}' $sdl bin/native-artifacts
      - name: Validate current source receipts and binary identities
        run: python -B tools/native/package.py check bin/native-artifacts --rids "${{ matrix.rid }}" --platform Windows
      - uses: actions/upload-artifact@v4
        with:
          name: private-native-Windows-${{ matrix.rid }}
          path: bin/native-artifacts/
          if-no-files-found: error
  package_windows:
    needs: native_windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r tools/native/requirements-windows.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: private-native-Windows-*
          merge-multiple: true
          path: bin/native-artifacts/
      - name: Pack all three Windows native architectures
        run: dotnet pack tools/native/Native.csproj -c Release -p:NativePackagePlatform=Windows -o bin/native-feed
      - uses: actions/upload-artifact@v4
        with:
          name: private-native-package-windows
          path: bin/native-feed/*.nupkg
          if-no-files-found: error
  consumer:
    needs: [package, package_macos]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: private-native-package*
          merge-multiple: true
          path: bin/native-feed/
      - name: Verify public native consumers with native tools blocked
        run: python3 -B tools/native/test_consumer.py bin/native-feed
  native_cross:
    needs: cross_matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cross_matrix.outputs.rids) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: recipe
        run: echo "hash=$(python -B tools/native/package.py fingerprint)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: native_cache
        if: ${{ !inputs.rebuild }}
        with:
          path: bin/native-artifacts/
          key: native-${{ matrix.rid }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.recipe.outputs.hash }}
      - uses: actions/setup-java@v5
        if: matrix.platform == 'Android' && steps.native_cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android toolchain
        if: matrix.platform == 'Android' && steps.native_cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y patchelf
      - name: Install SDK-matched WebAssembly toolchain
        if: matrix.platform == 'Web' && steps.native_cache.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools
      - name: Install WebAssembly archive audit tools
        if: matrix.platform == 'Web'
        run: |
          if ! command -v llvm-readobj > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y llvm
          fi
      - name: Restore the pinned target SDL core
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: dotnet restore tools/native/Native.csproj -p:NativePackagePlatform="${{ matrix.platform }}"
      - name: Build actual target libraries and audit their native closure
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: |
          args=()
          if [[ '${{ matrix.platform }}' == Android ]]; then args+=(--ndk "$ANDROID_HOME/ndk/28.2.13676358"); fi
          python -B tools/native/build_cross.py '${{ matrix.rid }}' bin/native-artifacts "${args[@]}"
      - name: Validate current source receipts and binary identities
        run: python -B tools/native/package.py check bin/native-artifacts --rids '${{ matrix.rid }}' --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: private-native-Cross-${{ matrix.platform }}-${{ matrix.rid }}
          path: bin/native-artifacts/
          if-no-files-found: error
  package_cross:
    needs: [cross_matrix, native_cross]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cross_matrix.outputs.packages) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install WebAssembly archive audit tools
        if: matrix.platform == 'Web'
        run: |
          if ! command -v llvm-readobj > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y llvm
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: private-native-Cross-${{ matrix.platform }}-*
          merge-multiple: true
          path: bin/native-artifacts/
      - name: Pack every architecture of the selected platform
        run: dotnet pack tools/native/Native.csproj -c Release -p:NativePackagePlatform='${{ matrix.platform }}' -o bin/native-feed
      - uses: actions/upload-artifact@v4
        with:
          name: private-native-package-${{ matrix.platform }}
          path: bin/native-feed/*.nupkg
          if-no-files-found: error
