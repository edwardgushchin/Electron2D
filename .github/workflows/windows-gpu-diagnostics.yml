name: Windows GPU diagnostics

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful native package workflow run
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  compound:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RestoreAdditionalProjectSources: ${{ github.workspace }}/bin/native-feed
      DOTNET_TieredCompilation: '0'
      ELECTRON2D_TEST_COMPOUND_PHYSICS: gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.1.3 ninja==1.13.0
      - uses: actions/cache@v4
        with:
          path: tools/shaders/obj/toolchain/
          key: shader-tools-windows-2025-${{ runner.arch }}-${{ hashFiles('tools/shaders/toolchain.lock.json', 'tools/shaders/build_toolchain.py') }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
          name: private-native-package-windows
          path: bin/native-feed/
      - name: Verify reused native payloads against current source
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools/native').resolve()))
          import package, test_consumer
          manifests = test_consumer.read_manifests(Path('bin/native-feed'))
          assert set(manifests) == {'win-x86', 'win-x64', 'win-arm64'}
          for receipt in manifests.values():
              assert receipt['sourceSHA256'] == package.source_hash()
              assert receipt['minimumEngineVersion'] == receipt['version'] == package.configuration()['version']
          PY
      - name: Verify owned debugger interruption
        shell: pwsh
        run: |
          ./tools/ci/test_debug_windows.ps1
          ./tools/ci/test_test_warp.ps1
      - name: Record source and trace cold pipeline preparation
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path('src/Servers/Physics/GPUPhysicsDevice.cs')
          original_bytes = path.read_bytes()
          original = original_bytes.decode()
          observer = 'PipelineCreationForTesting?.Invoke(name, _ownerThreadID, Environment.CurrentManagedThreadId);'
          assert original.count(observer) == 1
          newline = '\r\n' if b'\r\n' in original_bytes else '\n'
          trace = 'Console.WriteLine($"Cold GPU pipeline {DateTime.UtcNow:O}: {name}");'
          module_check = '''if (name == "PhysicsResidentBodies.comp.spv")
                  {
                      using var process = System.Diagnostics.Process.GetCurrentProcess();
                      using var warp = process.Modules.Cast<System.Diagnostics.ProcessModule>().FirstOrDefault(module => module.ModuleName.Equals("d3d10warp.dll", StringComparison.OrdinalIgnoreCase))
                          ?? throw new InvalidOperationException("The expected test WARP module was not loaded.");
                      if (!warp.FileName.Equals(System.IO.Path.Combine(AppContext.BaseDirectory, "d3d10warp.dll"), StringComparison.OrdinalIgnoreCase))
                          throw new InvalidOperationException("The expected app-local test WARP module was not selected.");
                      Console.WriteLine($"Test WARP module {warp.FileName}: {warp.FileVersionInfo.FileVersion}");
                  }'''.replace('\n', newline)
          trace += newline + '        ' + module_check
          instrumented = original.replace(observer, trace + newline + '        ' + observer, 1)
          finish = 'return new(ShaderCompiler.CreateComputePipeline(Device, bytes.ToArray()), handle => SDL.ReleaseGPUComputePipeline(Device, handle), Handle);'
          assert original.count(finish) == 1
          ready = finish.replace('return new(', 'var pipeline = new RenderHandle(', 1) + newline + '        Console.WriteLine($"GPU pipeline ready {DateTime.UtcNow:O}: {name}");' + newline + '        return pipeline;'
          path.write_bytes(instrumented.replace(finish, ready, 1).encode())
          motion = Path('src/Servers/Physics/Shaders/PhysicsResidentMotionQueries.comp.glsl')
          motion_original = motion.read_bytes()
          motion_text = motion_original.decode()
          motion_newline = '\r\n' if b'\r\n' in motion_original else '\n'
          start = 'void movingPair('
          end = 'vec4 queryBounds'
          assert motion_text.count(start) == motion_text.count(end) == 1
          first, last = motion_text.index(start), motion_text.index(end)
          fixture = Path('tools/ci/motion_linear.glsl').read_text()
          assert fixture.count(start) == 1 and fixture.endswith('}\n')
          motion_text = motion_text[:first] + fixture.replace('\n', motion_newline) + motion_text[last:]
          motion.write_bytes(motion_text.encode())
          compiler = Path('src/Servers/Rendering/ShaderCompiler.cs')
          compiler_bytes = compiler.read_bytes()
          Path('bin/diagnostics').mkdir(parents=True, exist_ok=True)
          receipt = {'compiler': 'current', 'headSHA': os.environ['GITHUB_SHA'], 'instrumentedSource': str(path),
                     'originalSHA256': hashlib.sha256(original_bytes).hexdigest(),
                     'actualSHA256': hashlib.sha256(path.read_bytes()).hexdigest(),
                     'originalCompilerSHA256': hashlib.sha256(compiler_bytes).hexdigest(),
                     'actualCompilerSHA256': hashlib.sha256(compiler.read_bytes()).hexdigest(),
                     'motionControl': 'linear overlap, directed reach/refinement and common impact; eight refinements unchanged',
                     'originalMotionSHA256': hashlib.sha256(motion_original).hexdigest(),
                     'actualMotionSHA256': hashlib.sha256(motion.read_bytes()).hexdigest()}
          Path('bin/diagnostics/compiler-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Publish the existing test runner
        run: dotnet publish tests/Electron2D.Tests/Electron2D.Tests.csproj -c Release -r win-x64 --self-contained true -o bin/diagnostics/runner --nologo
      - name: Install the pinned app-local test WARP
        shell: pwsh
        run: ./tools/ci/install_test_warp.ps1 bin/diagnostics/runner bin/diagnostics x64
      - name: Run the public compound fixture
        id: fixture
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          bin/diagnostics/runner/Electron2D.Tests.exe 2>&1 | tee bin/diagnostics/compound.log
          grep -Fx 'Compound GPU: transformed slots, gaps and disabled indices passed.' bin/diagnostics/compound.log
      - name: Capture native exception context
        if: steps.fixture.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: ./tools/ci/debug_windows.ps1 bin/diagnostics/runner/Electron2D.Tests.exe bin/diagnostics/cdb x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gpu-diagnostics-current
          path: |
            bin/diagnostics/compiler-source.json
            bin/diagnostics/warp-source.json
            bin/diagnostics/compound.log
            bin/diagnostics/cdb/
          if-no-files-found: error
      - name: Preserve the fixture failure
        if: steps.fixture.outcome == 'failure'
        run: exit 1
