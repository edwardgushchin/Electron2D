name: Windows GPU diagnostics

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful native package workflow run
        required: true
        type: string
      recovery_compiler:
        description: Compare native DXBC for all motion stages; other kernels retain production DXIL
        type: choice
        default: dxil
        options: [dxil, dxbc]
      optimize_motion_spirv:
        description: Compare optimized SPIR-V for the four motion stages
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  compound:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RestoreAdditionalProjectSources: ${{ github.workspace }}/bin/native-feed
      DOTNET_TieredCompilation: '0'
      ELECTRON2D_TEST_COMPOUND_PHYSICS: gpu
      RECOVERY_COMPILER: ${{ inputs.recovery_compiler }}
      MOTION_SPIRV_OPTIMIZATION: ${{ inputs.optimize_motion_spirv }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.1.3 ninja==1.13.0
      - uses: actions/cache@v4
        with:
          path: tools/shaders/obj/toolchain/
          key: shader-tools-windows-2025-${{ runner.arch }}-${{ hashFiles('tools/shaders/toolchain.lock.json', 'tools/shaders/build_toolchain.py') }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
          name: private-native-package-windows
          path: bin/native-feed/
      - name: Verify reused native payloads against current source
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools/native').resolve()))
          import package, test_consumer
          manifests = test_consumer.read_manifests(Path('bin/native-feed'))
          assert set(manifests) == {'win-x86', 'win-x64', 'win-arm64'}
          for receipt in manifests.values():
              assert receipt['sourceSHA256'] == package.source_hash()
              assert receipt['minimumEngineVersion'] == receipt['version'] == package.configuration()['version']
          PY
      - name: Verify owned debugger interruption
        shell: pwsh
        run: |
          ./tools/ci/test_debug_windows.ps1
          ./tools/ci/test_test_warp.ps1
      - name: Record source and trace cold pipeline preparation
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path('src/Servers/Physics/GPUPhysicsDevice.cs')
          original_bytes = path.read_bytes()
          original = original_bytes.decode()
          observer = 'PipelineCreationForTesting?.Invoke(name, _ownerThreadID, Environment.CurrentManagedThreadId);'
          assert original.count(observer) == 1
          newline = '\r\n' if b'\r\n' in original_bytes else '\n'
          trace = 'Console.WriteLine($"Cold GPU pipeline {DateTime.UtcNow:O}: {name}");'
          module_check = '''if (name == "PhysicsResidentBodies.comp.spv")
                  {
                      using var process = System.Diagnostics.Process.GetCurrentProcess();
                      using var warp = process.Modules.Cast<System.Diagnostics.ProcessModule>().FirstOrDefault(module => module.ModuleName.Equals("d3d10warp.dll", StringComparison.OrdinalIgnoreCase))
                          ?? throw new InvalidOperationException("The expected test WARP module was not loaded.");
                      if (!warp.FileName.Equals(System.IO.Path.Combine(AppContext.BaseDirectory, "d3d10warp.dll"), StringComparison.OrdinalIgnoreCase))
                          throw new InvalidOperationException("The expected app-local test WARP module was not selected.");
                      Console.WriteLine($"Test WARP module {warp.FileName}: {warp.FileVersionInfo.FileVersion}");
                  }'''.replace('\n', newline)
          trace += newline + '        ' + module_check
          instrumented = original.replace(observer, trace + newline + '        ' + observer, 1)
          finish = 'return new(ShaderCompiler.CreateComputePipeline(Device, bytes.ToArray()), handle => SDL.ReleaseGPUComputePipeline(Device, handle), Handle);'
          assert original.count(finish) == 1
          ready = finish.replace('return new(', 'var pipeline = new RenderHandle(', 1) + newline + '        Console.WriteLine($"GPU pipeline ready {DateTime.UtcNow:O}: {name}");' + newline + '        return pipeline;'
          path.write_bytes(instrumented.replace(finish, ready, 1).encode())
          compiler = Path('src/Servers/Rendering/ShaderCompiler.cs')
          compiler_original = compiler.read_bytes()
          generator = Path('tools/shaders/build_runtime.py')
          generator_original = generator.read_bytes()
          optimization = os.environ.get('MOTION_SPIRV_OPTIMIZATION', 'false')
          assert optimization in ('false', 'true')
          if optimization == 'true':
              text = generator_original.decode()
              condition = "and not stem.endswith('.portable'):"
              assert text.count(condition) == 1
              text = text.replace(condition, "and (not stem.endswith('.portable') or source.name == 'PhysicsResidentMotionQueries.comp.glsl'):")
              generator.write_bytes(text.encode())
          selection = os.environ['RECOVERY_COMPILER']
          assert selection in ('dxil', 'dxbc')
          if selection == 'dxbc':
              text = compiler_original.decode()
              signature = 'CreateComputePipeline(nint device, byte[] code)'
              compile = 'var compiled = ShaderCross.CompileDXILFromSPIRV(in info, out var size);'
              condition = 'if ((SDL.GetGPUShaderFormats(device) & SDL.GPUShaderFormat.DXIL) == 0)'
              assert text.count(signature) == text.count(compile) == text.count(condition) == 1
              text = text.replace(signature, 'CreateComputePipeline(nint device, byte[] code, bool nativeRecovery = false)')
              text = text.replace(condition, 'if (nativeRecovery && (SDL.GetGPUShaderFormats(device) & ShaderCross.GetSPIRVShaderFormats() & SDL.GPUShaderFormat.DXBC) == 0) throw new NotSupportedException("Native recovery requires DXBC support.");' + newline + '                ' + condition)
              text = text.replace(compile, 'if (nativeRecovery) Console.WriteLine($"Native motion compiler begin {DateTime.UtcNow:O}");' + newline + '                var compiled = nativeRecovery ? ShaderCross.CompileDXBCFromSPIRV(in info, out var size) : ShaderCross.CompileDXILFromSPIRV(in info, out size);')
              text = text.replace('if (compiled == 0) return 0;', 'if (compiled == 0) { Console.WriteLine("Compute compilation failed: " + SDL.GetError()); return 0; }')
              text = text.replace('Format = SDL.GPUShaderFormat.DXIL,', 'Format = nativeRecovery ? SDL.GPUShaderFormat.DXBC : SDL.GPUShaderFormat.DXIL,')
              pipeline = 'var pipeline = new SDL.GPUComputePipelineCreateInfo'
              assert text.count(pipeline) == 1
              dump = '''if (nativeRecovery)
                          {
                              var actualBytecode = new byte[checked((int)size)];
                              Marshal.Copy(compiled, actualBytecode, 0, actualBytecode.Length);
                              var directory = System.IO.Path.Combine(Environment.CurrentDirectory, "bin", "diagnostics", "motion-bytecode");
                              System.IO.Directory.CreateDirectory(directory);
                              var key = Convert.ToHexStringLower(System.Security.Cryptography.SHA256.HashData(code));
                              System.IO.File.WriteAllBytes(System.IO.Path.Combine(directory, key + ".dxbc"), actualBytecode);
                              Console.WriteLine($"Native motion compiler ready {DateTime.UtcNow:O}: {key}, {actualBytecode.Length} B");
                          }
                          '''.replace('\n', newline)
              text = text.replace(pipeline, dump + pipeline)
              compiler.write_bytes(text.encode())
              call = 'ShaderCompiler.CreateComputePipeline(Device, bytes.ToArray())'
              text = path.read_text()
              assert text.count(call) == 1
              kinds = 'name is "PhysicsResidentMotionQueries0.comp.portable.spv" or "PhysicsResidentMotionQueries1.comp.portable.spv" or "PhysicsResidentMotionQueries2.comp.portable.spv" or "PhysicsResidentMotionQueries3.comp.portable.spv"'
              path.write_text(text.replace(call, 'ShaderCompiler.CreateComputePipeline(Device, bytes.ToArray(), ' + kinds + ')'))
              shader = Path('src/Servers/Physics/Shaders/PhysicsResidentMotionQueries.comp.glsl')
              text = shader.read_text()
              result = 'if(rested)result=restResult;else safe=unsafeFraction=1;'
              assert text.count(result) == 1
              state = '    bool converged=false;'
              translate = '    safe=unsafeFraction=1;motionShape=0u;blocked=false;'
              publish = '#if E2D_MOTION_STAGE < 3'
              assert text.count(state) == text.count(translate) == text.count(publish) == 1
              history = '''#if E2D_MOTION_STAGE == 0
              uint motionProbe=0u;
              #else
              uint motionProbe=outputWords[stateAt+2u].w;
              #endif'''
              text = text.replace(state, state + '\n' + history)
              text = text.replace(translate, translate + '\n    motionProbe|=(safe==1&&unsafeFraction==1?4u:0u)|(q.motionMargin.xy!=vec2(0)?8u:0u);')
              history = '''#if E2D_MOTION_STAGE == 0
              motionProbe=safe==1?1u:0u;
              #elif E2D_MOTION_STAGE == 1
              motionProbe=(motionProbe&~2u)|(safe==1?2u:0u);
              #elif E2D_MOTION_STAGE == 2
              motionProbe|=(blocked?16u:0u)|(safe!=0?32u:0u);
              #endif
              #if E2D_MOTION_STAGE < 3
              outputWords[stateAt+2u].w=motionProbe;
              #endif'''
              text = text.replace(publish, history + '\n' + publish)
              probe = '''#if defined(E2D_MOTION_STAGE) && E2D_MOTION_STAGE == 3
              result.owner.w=state.w|(motionProbe<<8)|(blocked?1048576u:0u)|(rested?2097152u:0u);
              result.objectID.zw=fractions.xy;
              #endif'''
              shader.write_text(text.replace(result, result + '\n' + probe))
              query = Path('src/Servers/Physics/GPUPhysicsBodyStore.MotionQueries.cs')
              text = query.read_text()
              returned = '        for (var i = 0; i < queries.Length; i++)\n            if (_motionQueryCounts[i] == 0)'
              field = 'private int[] _motionQueryCounts = [];'
              assert text.count(returned) == text.count(field) == 1
              text = text.replace(field, field + '\n    private bool _motionProbeWritten;')
              probe = '        if (!_motionProbeWritten) { _motionProbeWritten = true; Console.WriteLine($"Motion stage receipt: count={_motionQueryCounts[0]}, flags={results[0].Flags}, state={results[0].Padding}, incomingFractions=0x{results[0].Padding2:X16}, finalFractions={results[0].Fractions}, travel={results[0].TravelRemainder}"); }\n'
              query.write_text(text.replace(returned, probe + returned))
          Path('bin/diagnostics').mkdir(parents=True, exist_ok=True)
          receipt = {'compiler': selection + ' motion; DXIL remaining kernels', 'headSHA': os.environ['GITHUB_SHA'], 'instrumentedSource': str(path),
                     'originalSHA256': hashlib.sha256(original_bytes).hexdigest(),
                     'actualSHA256': hashlib.sha256(path.read_bytes()).hexdigest(),
                     'originalCompilerSHA256': hashlib.sha256(compiler_original).hexdigest(),
                     'actualCompilerSHA256': hashlib.sha256(compiler.read_bytes()).hexdigest(),
                     'motionSPIRVOptimization': optimization == 'true',
                     'originalGeneratorSHA256': hashlib.sha256(generator_original).hexdigest(),
                     'actualGeneratorSHA256': hashlib.sha256(generator.read_bytes()).hexdigest(),
                     'motionStages': ['initial recovery', 'continued recovery x3', 'translation', 'rest and result'],
                     'probeHistoryBits': {'0': 'initial recovery safe=1', '1': 'last continued recovery safe=1',
                                          '2': 'translation starts safe=unsafe=1', '3': 'translation input motion nonzero',
                                          '4': 'translation exits blocked', '5': 'translation exits safe nonzero'},
                     'probeResultBits': {'0-7': 'incoming state flags', '8-13': 'probe history', '20': 'final blocked', '21': 'rested'},
                     'shaderSHA256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in
                         ['src/Servers/Rendering/ShaderCompiler.cs', 'src/Servers/Physics/GPUPhysicsBodyStore.MotionQueries.cs',
                          'src/Servers/Physics/Shaders/PhysicsResidentMotionQueries.comp.glsl']}}
          Path('bin/diagnostics/compiler-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Publish the existing test runner
        run: dotnet publish tests/Electron2D.Tests/Electron2D.Tests.csproj -c Release -r win-x64 --self-contained true -o bin/diagnostics/runner --nologo
      - name: Install the pinned app-local test WARP
        shell: pwsh
        run: ./tools/ci/install_test_warp.ps1 bin/diagnostics/runner bin/diagnostics x64
      - name: Run the public compound fixture
        id: fixture
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $executable = (Resolve-Path 'bin/diagnostics/runner/Electron2D.Tests.exe').Path
          $log = 'bin/diagnostics/compound.log'
          & $executable 2>&1 | Tee-Object -FilePath $log
          $code = [int]$LASTEXITCODE
          ('Runtime exit: {0} (0x{0:X8})' -f $code) | Tee-Object -FilePath $log -Append
          if ($code -ne 0) { exit 1 }
          if (!((Get-Content $log) -ccontains 'Compound GPU: transformed slots, gaps and disabled indices passed.')) {
              throw 'The compound completion marker is missing.'
          }
      - name: Disassemble actual native motion bytecode
        if: always() && inputs.recovery_compiler == 'dxbc'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Filter fxc.exe -Recurse |
              Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName | Select-Object -Last 1
          if (!$compiler) { throw 'The SDK FXC disassembler is unavailable.' }
          foreach ($module in Get-ChildItem bin/diagnostics/motion-bytecode/*.dxbc) {
              & $compiler.FullName /dumpbin /nologo $module.FullName 2>&1 | Set-Content ($module.FullName + '.asm')
              if ($LASTEXITCODE -ne 0) { throw "Native bytecode disassembly failed: $($module.Name)" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gpu-fixture
          path: |
            bin/diagnostics/compiler-source.json
            bin/diagnostics/warp-source.json
            bin/diagnostics/compound.log
            bin/diagnostics/motion-bytecode/
          if-no-files-found: error
      - name: Capture native exception context
        if: steps.fixture.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: ./tools/ci/debug_windows.ps1 bin/diagnostics/runner/Electron2D.Tests.exe bin/diagnostics/cdb x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gpu-diagnostics
          path: |
            bin/diagnostics/compiler-source.json
            bin/diagnostics/warp-source.json
            bin/diagnostics/compound.log
            bin/diagnostics/cdb/
            bin/diagnostics/motion-bytecode/
          if-no-files-found: error
      - name: Preserve the fixture failure
        if: steps.fixture.outcome == 'failure'
        run: exit 1
