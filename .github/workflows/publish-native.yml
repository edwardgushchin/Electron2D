name: Publish Electron2D packages

on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful full CI run on main containing release-qualified
        required: true
        type: string
      nuget_user:
        description: NuGet profile name (not an email address)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-private-native-package
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302
      - name: Resolve the explicit trusted qualification
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: python3 -B tools/ci/packages.py resolve "$QUALIFICATION_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.qualification.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.qualification.outputs.artifact }}
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ github.token }}
          path: bin/qualified/
      - name: Reject changed or incomplete package bytes
        run: python3 -B tools/ci/packages.py verify bin/qualified
      - name: Obtain a short-lived NuGet publishing key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ inputs.nuget_user }}
      - name: Publish only missing qualified packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: python3 -B tools/ci/packages.py publish bin/qualified
      - name: Verify public payloads and repository signatures
        run: python3 -B tools/ci/packages.py public bin/qualified
      - name: Reconcile GitHub assets and publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/ci/packages.py release bin/qualified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-package-verification
          path: |
            bin/qualified/qualification.json
            bin/qualified/public/verification.json
          if-no-files-found: warn
          retention-days: 30
