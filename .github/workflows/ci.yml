name: CI

on:
  push:
    branches: [main, codex/rid-runtime-checks]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      profile:
        description: Fast feedback, complete qualification or a clean native rebuild
        type: choice
        options: [full, fast, clean]
        default: full
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ (github.event_name == 'workflow_dispatch' && inputs.profile != 'fast' || github.event_name == 'schedule') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        run: python3 -B tools/ci/plan.py >> "$GITHUB_OUTPUT"
      - run: echo '${{ steps.plan.outputs.reason }}' >> "$GITHUB_STEP_SUMMARY"
  fast:
    name: Fast feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: shader_cache
        with:
          path: tools/shaders/obj/toolchain/
          key: shader-tools-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('tools/shaders/toolchain.lock.json', 'tools/shaders/build_toolchain.py') }}
      - if: steps.shader_cache.outputs.cache-hit != 'true'
        run: python -m pip install cmake==4.1.3 ninja==1.13.0
      - run: python3 -B tools/ci/test_pipeline.py
      - run: python3 -B tools/ci/test_checks.py
      - run: dotnet build Electron2D.csproj -c Release
      - run: dotnet run --project tests/Electron2D.FastTests -c Release
      - run: tools/coverage/check.sh
      - run: python3 -B tools/wiki/test_generate.py
      - run: python3 -B tools/wiki/generate.py
      - run: python3 -B tools/wiki/generate.py --check
  matrix:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    outputs:
      rids: ${{ steps.rids.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tools/ci/test_checks.py
      - id: rids
        run: python3 -B tools/ci/rids.py >> "$GITHUB_OUTPUT"
  native:
    needs: [plan, fast]
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/native.yml
    with:
      rebuild: ${{ needs.plan.outputs.rebuild == 'true' }}
  build:
    needs: [plan, matrix, native]
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.rids) }}
    name: Build / ${{ matrix.label }}
    uses: ./.github/workflows/rid.yml
    with:
      rid: ${{ matrix.rid }}
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      workload: ${{ matrix.workload }}
      suite: ${{ matrix.suite }}
  tests:
    needs: [plan, matrix, native]
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.rids) }}
    name: Tests / ${{ matrix.label }}
    uses: ./.github/workflows/rid.yml
    with:
      rid: ${{ matrix.rid }}
      label: ${{ matrix.label }}
      runner: ${{ matrix.rid == 'osx-x64' && 'macos-26' || matrix.runner }}
      workload: ${{ matrix.workload }}
      suite: ${{ matrix.suite }}
      tests: true
  build_status:
    name: Build
    if: always() && needs.plan.outputs.full == 'true'
    needs: [plan, matrix, native, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require successful builds and native preparation
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B tools/ci/check_status.py build
  tests_status:
    name: Tests
    if: always() && needs.plan.outputs.full == 'true'
    needs: [plan, matrix, native, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require successful tests and native preparation
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B tools/ci/check_status.py tests
  development:
    name: Development
    if: always()
    needs: [plan, fast, build_status, tests_status, qualify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B tools/ci/check_status.py development
  qualify:
    needs: [plan, fast, build_status, tests_status]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-package*"
          merge-multiple: true
          path: bin/qualified/
      - run: python3 -B tools/ci/packages.py record bin/qualified
      - uses: actions/upload-artifact@v4
        with:
          name: release-qualified
          path: bin/qualified/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
