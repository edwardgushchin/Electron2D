name: CI

on:
  push:
    branches: [main, codex/rid-runtime-checks]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      rids: ${{ steps.rids.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tools/ci/test_checks.py
      - id: rids
        run: python3 -B tools/ci/rids.py >> "$GITHUB_OUTPUT"
  native:
    uses: ./.github/workflows/native.yml
  build:
    needs: [matrix, native]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.rids) }}
    name: Build
    uses: ./.github/workflows/rid.yml
    with:
      rid: ${{ matrix.rid }}
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      workload: ${{ matrix.workload }}
      suite: ${{ matrix.suite }}
  tests:
    needs: [matrix, native]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.rids) }}
    name: Tests
    uses: ./.github/workflows/rid.yml
    with:
      rid: ${{ matrix.rid }}
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      workload: ${{ matrix.workload }}
      suite: ${{ matrix.suite }}
      tests: true
  build_status:
    name: Build
    if: always()
    needs: [matrix, native, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require successful builds and native preparation
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B tools/ci/check_status.py build
  tests_status:
    name: Tests
    if: always()
    needs: [matrix, native, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require successful tests and native preparation
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B tools/ci/check_status.py tests
