name: Linux GPU diagnostics

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Workflow run containing audited Linux native packages
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  compound:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RestoreAdditionalProjectSources: ${{ github.workspace }}/bin/native-feed
      DOTNET_TieredCompilation: '0'
      SDL_VIDEO_DRIVER: offscreen
      SDL_VIDEODRIVER: offscreen
      ELECTRON2D_TEST_COMPOUND_PHYSICS: gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.1.3 ninja==1.13.0
      - uses: actions/cache@v4
        with:
          path: tools/shaders/obj/toolchain/
          key: shader-tools-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('tools/shaders/toolchain.lock.json', 'tools/shaders/build_toolchain.py') }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
          name: private-native-package
          path: bin/native-feed/
      - name: Verify native source receipts
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools/native').resolve()))
          import package, test_consumer
          manifests = test_consumer.read_manifests(Path('bin/native-feed'))
          assert set(manifests) == {'linux-x64', 'linux-arm64'}
          for receipt in manifests.values():
              assert receipt['sourceSHA256'] == package.source_hash()
              assert receipt['minimumEngineVersion'] == receipt['version'] == package.configuration()['version']
          PY
      - name: Install and record runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd1 libssl-dev ffmpeg libvulkan1 mesa-vulkan-drivers
          mkdir -p bin/diagnostics
          lscpu > bin/diagnostics/cpu.txt
          dpkg-query -W libvulkan1 mesa-vulkan-drivers > bin/diagnostics/driver.txt
      - name: Publish the unchanged test runner
        run: |
          dotnet publish tests/Electron2D.Tests/Electron2D.Tests.csproj -c Release -r linux-x64 --self-contained true -o bin/diagnostics/runner --nologo
          cp obj/Release/net10.0/linux-x64/shaders/manifest.json bin/diagnostics/baseline-shaders.json
      - name: Run the unchanged compound fixture
        id: baseline
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/baseline.log
          grep -Fx 'Compound GPU: transformed slots, gaps and disabled indices passed.' bin/diagnostics/baseline.log
      - name: Trace candidate and impact boundaries in a temporary source copy
        if: steps.baseline.outcome == 'failure'
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path('src/Servers/Physics/GPUPhysicsBodyStore.Continuous.cs')
          original = path.read_bytes()
          source = original.decode()
          newline = '\r\n' if b'\r\n' in original else '\n'
          markers = {
              'var pairs = FindPairs(CCDTolerance, delta, _hasPositionCorrections);': 'Console.WriteLine($"CCD candidates delta={delta:R}, pairs={pairs}, enabled={_ccdBodyCount}, corrections={_hasPositionCorrections}");',
              'result = ((float*)mapped)[1];': 'Console.WriteLine($"CCD result status={*(uint*)mapped}, fraction={result:R}");'
          }
          for marker, trace in markers.items():
              assert source.count(marker) == 1
              source = source.replace(marker, marker + newline + '                ' + trace, 1)
          path.write_bytes(source.encode())
          receipt = {'headSHA': os.environ['GITHUB_SHA'], 'source': str(path),
                     'originalSHA256': hashlib.sha256(original).hexdigest(),
                     'actualSHA256': hashlib.sha256(path.read_bytes()).hexdigest()}
          Path('bin/diagnostics/trace-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          dotnet publish tests/Electron2D.Tests/Electron2D.Tests.csproj -c Release -r linux-x64 --self-contained true -o bin/diagnostics/runner --nologo
          cmp obj/Release/net10.0/linux-x64/shaders/manifest.json bin/diagnostics/baseline-shaders.json
      - name: Replay the compound fixture with boundary tracing
        if: steps.baseline.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/trace.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-gpu-diagnostics
          path: |
            bin/diagnostics/*.log
            bin/diagnostics/*.json
            bin/diagnostics/*.txt
          if-no-files-found: error
      - name: Preserve the unchanged fixture failure
        if: steps.baseline.outcome == 'failure'
        run: exit 1
