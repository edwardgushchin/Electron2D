name: Linux GPU diagnostics

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Workflow run containing audited Linux native packages
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  compound:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RestoreAdditionalProjectSources: ${{ github.workspace }}/bin/native-feed
      DOTNET_TieredCompilation: '0'
      SDL_VIDEO_DRIVER: offscreen
      SDL_VIDEODRIVER: offscreen
      ELECTRON2D_TEST_COMPOUND_PHYSICS: gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.1.3 ninja==1.13.0
      - uses: actions/cache@v4
        with:
          path: tools/shaders/obj/toolchain/
          key: shader-tools-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('tools/shaders/toolchain.lock.json', 'tools/shaders/build_toolchain.py') }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
          name: private-native-package
          path: bin/native-feed/
      - name: Verify native source receipts
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools/native').resolve()))
          import package, test_consumer
          manifests = test_consumer.read_manifests(Path('bin/native-feed'))
          assert set(manifests) == {'linux-x64', 'linux-arm64'}
          for receipt in manifests.values():
              assert receipt['sourceSHA256'] == package.source_hash()
              assert receipt['minimumEngineVersion'] == receipt['version'] == package.configuration()['version']
          PY
      - name: Install and record runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd1 libssl-dev ffmpeg libvulkan1 mesa-vulkan-drivers
          mkdir -p bin/diagnostics
          lscpu > bin/diagnostics/cpu.txt
          dpkg-query -W libvulkan1 mesa-vulkan-drivers > bin/diagnostics/driver.txt
      - name: Publish the unchanged test runner
        run: |
          dotnet publish tests/Electron2D.Tests/Electron2D.Tests.csproj -c Release -r linux-x64 --self-contained true -o bin/diagnostics/runner --nologo
          cp obj/Release/net10.0/linux-x64/shaders/manifest.json bin/diagnostics/baseline-shaders.json
      - name: Run the unchanged compound fixture
        id: baseline
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/baseline.log
          grep -Fx 'Compound GPU: transformed slots, gaps and disabled indices passed.' bin/diagnostics/baseline.log
      - name: Trace candidate and impact boundaries in a temporary source copy
        if: steps.baseline.outcome == 'failure'
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path('src/Servers/Physics/GPUPhysicsBodyStore.Continuous.cs')
          original = path.read_bytes()
          Path('bin/diagnostics/continuous-original.cs').write_bytes(original)
          source = original.decode()
          newline = '\r\n' if b'\r\n' in original else '\n'
          markers = {
              'var pairs = FindPairs(CCDTolerance, delta, _hasPositionCorrections);': 'Console.WriteLine($"CCD candidates delta={delta:R}, pairs={pairs}, enabled={_ccdBodyCount}, corrections={_hasPositionCorrections}");',
              'result = ((float*)mapped)[1];': 'Console.WriteLine($"CCD result status={*(uint*)mapped}, fraction={result:R}");'
          }
          for marker, trace in markers.items():
              assert source.count(marker) == 1
              source = source.replace(marker, marker + newline + '                ' + trace, 1)
          marker = 'if (pairs == 0) return 1;'
          assert source.count(marker) == 1
          source = source.replace(marker, marker + newline + '        TraceCCDInputs(pairs, delta);', 1)
          helper = Path('src/Servers/Physics/GPUPhysicsBodyStore.CCDDiagnostic.cs')
          assert not helper.exists()
          helper.write_bytes(Path('tools/ci/LinuxCCDTrace.inc.cs').read_bytes())
          path.write_bytes(source.encode())
          receipt = {'headSHA': os.environ['GITHUB_SHA'], 'source': str(path),
                     'originalSHA256': hashlib.sha256(original).hexdigest(),
                     'actualSHA256': hashlib.sha256(path.read_bytes()).hexdigest(),
                     'helperSHA256': hashlib.sha256(helper.read_bytes()).hexdigest()}
          store = Path('src/Servers/Physics/GPUPhysicsBodyStore.cs')
          store_original = store.read_bytes()
          Path('bin/diagnostics/body-store-original.cs').write_bytes(store_original)
          store_source = store_original.decode()
          store_newline = '\r\n' if b'\r\n' in store_original else '\n'
          for marker, trace in {
              'SDL.EndGPUComputePass(compute);': 'TraceBodyStage(command, settings);',
              'WaitMS += Stopwatch.GetElapsedTime(start).TotalMilliseconds; SubmissionCount++;': 'CompleteBodyStageTrace();'
          }.items():
              assert store_source.count(marker) == 1
              store_source = store_source.replace(marker, marker + store_newline + '        ' + trace, 1)
          store.write_bytes(store_source.encode())
          receipt['bodyStore'] = {'source': str(store),
              'originalSHA256': hashlib.sha256(store_original).hexdigest(),
              'actualSHA256': hashlib.sha256(store.read_bytes()).hexdigest()}
          Path('bin/diagnostics/trace-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          dotnet publish tests/Electron2D.Tests/Electron2D.Tests.csproj -c Release -r linux-x64 --self-contained true -o bin/diagnostics/runner --nologo
          cmp obj/Release/net10.0/linux-x64/shaders/manifest.json bin/diagnostics/baseline-shaders.json
      - name: Replay the compound fixture with boundary tracing
        if: steps.baseline.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/trace.log
      - name: Prepare an untraced Lavapipe control
        if: steps.baseline.outcome == 'failure'
        run: |
          python -B tools/ci/select_lavapipe.py > bin/diagnostics/selected-driver.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          receipt = json.loads(Path('bin/diagnostics/trace-source.json').read_text())
          original = Path('bin/diagnostics/continuous-original.cs').read_bytes()
          assert receipt['headSHA'] == os.environ['GITHUB_SHA']
          assert hashlib.sha256(original).hexdigest() == receipt['originalSHA256']
          path = Path('src/Servers/Physics/GPUPhysicsBodyStore.Continuous.cs')
          assert str(path) == receipt['source']
          helper = Path('src/Servers/Physics/GPUPhysicsBodyStore.CCDDiagnostic.cs')
          assert hashlib.sha256(helper.read_bytes()).hexdigest() == receipt['helperSHA256']
          store_receipt = receipt['bodyStore']
          store = Path('src/Servers/Physics/GPUPhysicsBodyStore.cs')
          store_original = Path('bin/diagnostics/body-store-original.cs').read_bytes()
          assert str(store) == store_receipt['source']
          assert hashlib.sha256(store_original).hexdigest() == store_receipt['originalSHA256']
          assert hashlib.sha256(store.read_bytes()).hexdigest() == store_receipt['actualSHA256']
          path.write_bytes(original)
          store.write_bytes(store_original)
          helper.unlink()
          PY
          dotnet publish tests/Electron2D.Tests/Electron2D.Tests.csproj -c Release -r linux-x64 --self-contained true -o bin/diagnostics/runner --nologo
          cmp obj/Release/net10.0/linux-x64/shaders/manifest.json bin/diagnostics/baseline-shaders.json
      - name: Run the untraced Lavapipe compound fixture
        if: steps.baseline.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/lavapipe.log
          grep -Fx 'Compound GPU: transformed slots, gaps and disabled indices passed.' bin/diagnostics/lavapipe.log
      - name: Record cold device identity for SIMD controls
        run: |
          python -B tools/ci/select_lavapipe.py > bin/diagnostics/simd-driver.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path('src/Servers/Physics/GPUPhysicsDevice.cs')
          original = path.read_bytes()
          source = original.decode()
          marker, = [line for line in source.splitlines() if line.strip().startswith('DeviceName = SDL.GetStringProperty(')]
          assert source.count(marker) == 1 and 'Diagnostic GPU:' not in source
          newline = '\r\n' if b'\r\n' in original else '\n'
          path.write_bytes(source.replace(marker, marker + newline + '            Console.WriteLine($"Diagnostic GPU: {Driver}, {DeviceName}");', 1).encode())
          receipt = {'headSHA': os.environ['GITHUB_SHA'], 'source': str(path),
                     'originalSHA256': hashlib.sha256(original).hexdigest(),
                     'actualSHA256': hashlib.sha256(path.read_bytes()).hexdigest()}
          Path('bin/diagnostics/simd-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          dotnet publish tests/Electron2D.Tests/Electron2D.Tests.csproj -c Release -r linux-x64 --self-contained true -o bin/diagnostics/runner --nologo
          cmp obj/Release/net10.0/linux-x64/shaders/manifest.json bin/diagnostics/baseline-shaders.json
          sha256sum bin/diagnostics/runner/Electron2D.dll bin/diagnostics/runner/Electron2D.Tests.dll > bin/diagnostics/simd-binaries.txt
      - name: Compare Lavapipe SIMD widths with the complete compound fixture
        id: simd_control
        continue-on-error: true
        timeout-minutes: 10
        run: |
          failed=0
          for width in 128 256; do
            log="bin/diagnostics/simd-$width.log"
            set +e
            LP_NATIVE_VECTOR_WIDTH="$width" GALLIUM_DUMP_CPU=1 MESA_SHADER_CACHE_DIR="$GITHUB_WORKSPACE/bin/diagnostics/cache-$width" bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set -e
            echo "Runtime exit: $code" | tee -a "$log"
            if [[ "$code" -ne 0 ]] || ! grep -Fx 'Compound GPU: transformed slots, gaps and disabled indices passed.' "$log"; then failed=1; fi
            if ! grep -E "^Diagnostic GPU: vulkan, .* $width bits" "$log"; then failed=1; fi
          done
          exit "$failed"
      - name: Run the complete GPU fixture without managed SIMD intrinsics
        id: managed_scalar
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          set +e
          DOTNET_EnableHWIntrinsic=0 GALLIUM_DUMP_CPU=1 MESA_SHADER_CACHE_DIR="$GITHUB_WORKSPACE/bin/diagnostics/cache-managed-scalar" bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/managed-scalar.log
          code=${PIPESTATUS[0]}
          set -e
          echo "Runtime exit: $code" | tee -a bin/diagnostics/managed-scalar.log
          test "$code" -eq 0
          grep -Fx 'Compound GPU: transformed slots, gaps and disabled indices passed.' bin/diagnostics/managed-scalar.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-gpu-diagnostics
          path: |
            bin/diagnostics/*.log
            bin/diagnostics/*.json
            bin/diagnostics/*.txt
            bin/diagnostics/ccd-*.bin
            bin/diagnostics/body-stage-*.bin
          if-no-files-found: error
      - name: Preserve original and SIMD fixture failures
        if: steps.baseline.outcome == 'failure' || steps.simd_control.outcome == 'failure' || steps.managed_scalar.outcome == 'failure'
        run: exit 1
