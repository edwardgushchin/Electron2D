name: macOS runtime verification
run-name: macOS ${{ inputs.allocation_trace && 'allocation diagnostics' || 'runtime verification' }}

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Workflow run containing audited macOS native packages
        required: true
        type: string
      allocation_trace:
        description: Diagnose allocations with a calibrated native profiler; does not replace an untraced gate
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  full_suite:
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    defaults:
      run:
        shell: bash
    env:
      RestoreAdditionalProjectSources: ${{ github.workspace }}/bin/native-feed
      DOTNET_TieredCompilation: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.1.3 ninja==1.13.0
      - uses: actions/cache@v4
        with:
          path: tools/shaders/obj/toolchain/
          key: shader-tools-macos-26-${{ runner.arch }}-${{ hashFiles('tools/shaders/toolchain.lock.json', 'tools/shaders/build_toolchain.py') }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
          name: private-native-package-macos
          path: bin/native-feed/
      - name: Verify native source receipts
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools/native').resolve()))
          import package, test_consumer
          manifests = test_consumer.read_manifests(Path('bin/native-feed'))
          assert set(manifests) == {'osx-x64', 'osx-arm64'}
          for receipt in manifests.values():
              assert receipt['sourceSHA256'] == package.source_hash()
              assert receipt['minimumEngineVersion'] == receipt['version'] == package.configuration()['version']
          PY
      - name: Install test oracles
        run: |
          brew install ffmpeg openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Prepare x64 execution on Apple Silicon
        if: matrix.rid == 'osx-x64'
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          test "$(arch -x86_64 /usr/bin/uname -m)" = x86_64
      - name: Publish the complete test runner
        run: dotnet publish tests/Electron2D.Tests/Electron2D.Tests.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -o bin/diagnostics/runner --nologo
      - name: Prepare calibrated allocation diagnostics
        if: inputs.allocation_trace
        run: |
          clang++ -std=c++17 -O2 -dynamiclib -pthread -arch '${{ matrix.rid == 'osx-x64' && 'x86_64' || 'arm64' }}' tools/ci/managed_allocation_trace.cpp -o bin/diagnostics/libManagedAllocationTrace.dylib
          codesign --force --sign - bin/diagnostics/libManagedAllocationTrace.dylib
          lipo -info bin/diagnostics/libManagedAllocationTrace.dylib
          dotnet publish tools/ci/managed-allocation/Calibration.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -o bin/diagnostics/calibration-runner --nologo
          python3 -B tools/ci/test_managed_allocation_trace.py bin/diagnostics/libManagedAllocationTrace.dylib bin/diagnostics/calibration-runner/Calibration bin/diagnostics/allocation-calibration
      - uses: actions/upload-artifact@v4
        if: always() && inputs.allocation_trace
        with:
          name: macos-allocation-modules-${{ matrix.rid }}
          path: |
            bin/diagnostics/allocation-calibration/
            bin/diagnostics/libManagedAllocationTrace.dylib
            bin/diagnostics/runner/System.Private.CoreLib.dll
            bin/diagnostics/runner/Electron2D.dll
            bin/diagnostics/runner/Electron2D.Tests.dll
            bin/diagnostics/runner/PhysicsBackendExtension.Consumer.dll
          if-no-files-found: error
      - name: Profile the prepared allocation intervals
        id: button_trace
        if: inputs.allocation_trace
        continue-on-error: true
        env:
          CORECLR_ENABLE_PROFILING: '1'
          CORECLR_PROFILER: '{4CB0917C-5E03-4787-83BC-98C86DC7BE4C}'
          CORECLR_PROFILER_PATH: ${{ github.workspace }}/bin/diagnostics/libManagedAllocationTrace.dylib
          ELECTRON2D_POINT_ALLOCATION_TRACE: ${{ github.workspace }}/bin/diagnostics/libManagedAllocationTrace.dylib
        run: |
          set -o pipefail
          umask 077
          ELECTRON2D_TEST_BUTTONS=1 E2D_ALLOCATION_TRACE="$PWD/bin/diagnostics/buttons-allocation.trace" bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/buttons-trace.log
          ELECTRON2D_TEST_AREA_BACKEND=cpu E2D_ALLOCATION_TRACE="$PWD/bin/diagnostics/area-cpu.trace" bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/area-cpu-trace.log
          ELECTRON2D_TEST_AREA_BACKEND=gpu E2D_ALLOCATION_TRACE="$PWD/bin/diagnostics/area-gpu.trace" bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/area-gpu-trace.log
          ELECTRON2D_TEST_AUDIO_COMPRESSED=cpu E2D_ALLOCATION_TRACE="$PWD/bin/diagnostics/audio-compressed.trace" bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/audio-compressed-trace.log
          ELECTRON2D_TEST_PHYSICS_THREAD=1 E2D_ALLOCATION_TRACE="$PWD/bin/diagnostics/joint-policy.trace" bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/joint-policy-trace.log
          ELECTRON2D_TEST_OWNER_DISABLE_CONTRACT=gpu E2D_ALLOCATION_TRACE="$PWD/bin/diagnostics/shape-owner.trace" bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/shape-owner-trace.log
          ELECTRON2D_TEST_CONTACT_CORRECTION=cpu E2D_ALLOCATION_TRACE="$PWD/bin/diagnostics/contact-policy-cpu.trace" bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/contact-policy-cpu-trace.log
          ELECTRON2D_TEST_CONTACT_CORRECTION=gpu E2D_ALLOCATION_TRACE="$PWD/bin/diagnostics/contact-policy-gpu.trace" bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/contact-policy-gpu-trace.log
      - name: Check platform input and fresh-process contact history
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          ELECTRON2D_TEST_CODE_EDIT=1 bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/codeedit.log
          ELECTRON2D_TEST_BUTTONS=1 bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/buttons.log
          ELECTRON2D_TEST_FONT_SUPPORT=1 bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/font-support.log
          ELECTRON2D_TEST_TEXT_LINE=1 bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/text-line.log
          ELECTRON2D_TEST_TEXT_PARAGRAPH=1 bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/text-paragraph.log
          ELECTRON2D_TEST_LINK=1 bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/link-button.log
          ELECTRON2D_TEST_CHARACTER_BODY=cpu bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/character-cpu.log
          ELECTRON2D_TEST_CHARACTER_BODY=gpu bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/character-gpu.log
          ELECTRON2D_TEST_AREA_BACKEND=cpu bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/area-cpu.log
          ELECTRON2D_TEST_AREA_BACKEND=gpu bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/area-gpu.log
          ELECTRON2D_TEST_AUDIO_COMPRESSED=cpu bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/audio-compressed.log
          ELECTRON2D_TEST_PHYSICS_THREAD=1 bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/joint-policy.log
          ELECTRON2D_TEST_OWNER_DISABLE_CONTRACT=gpu bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/shape-owner.log
          ELECTRON2D_TEST_CONTACT_CORRECTION=cpu bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/contact-policy-cpu.log
          ELECTRON2D_TEST_CONTACT_CORRECTION=gpu bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/contact-policy-gpu.log
          ELECTRON2D_TEST_TILE_TERRAINS=1 bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/terrain.log
          ELECTRON2D_TEST_PUBLIC_CONTACT_HISTORY=gpu bin/diagnostics/runner/Electron2D.Tests 2>&1 | tee bin/diagnostics/contact-history.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-focused-${{ matrix.rid }}
          path: |
            bin/diagnostics/*.log
            bin/diagnostics/buttons-allocation.trace.*
            bin/diagnostics/area-*.trace.*
            bin/diagnostics/audio-compressed.trace.*
            bin/diagnostics/joint-policy.trace.*
            bin/diagnostics/shape-owner.trace.*
            bin/diagnostics/contact-policy-*.trace.*
          if-no-files-found: error
      - name: Run the complete ${{ inputs.allocation_trace && 'profiled' || 'untraced' }} suite
        id: fixture
        if: inputs.allocation_trace || steps.focused.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p bin/diagnostics
          if [[ '${{ inputs.allocation_trace }}' == true ]]; then
            umask 077
            export CORECLR_ENABLE_PROFILING=1
            export CORECLR_PROFILER='{4CB0917C-5E03-4787-83BC-98C86DC7BE4C}'
            export CORECLR_PROFILER_PATH="$PWD/bin/diagnostics/libManagedAllocationTrace.dylib"
            export ELECTRON2D_POINT_ALLOCATION_TRACE="$CORECLR_PROFILER_PATH"
            export E2D_ALLOCATION_TRACE="$PWD/bin/diagnostics/full-allocation.trace"
          fi
          python3 -B tools/ci/run_macos_runtime.py bin/diagnostics/runner/Electron2D.Tests bin/diagnostics/full-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-runtime-${{ matrix.rid }}
          path: bin/diagnostics/*.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.allocation_trace
        with:
          name: macos-allocation-${{ matrix.rid }}
          path: |
            bin/diagnostics/full-allocation.trace.*
            bin/diagnostics/buttons-allocation.trace.*
            bin/diagnostics/area-*.trace.*
            bin/diagnostics/audio-compressed.trace.*
            bin/diagnostics/joint-policy.trace.*
            bin/diagnostics/shape-owner.trace.*
            bin/diagnostics/contact-policy-*.trace.*
          if-no-files-found: error
      - name: Preserve the full-suite failure
        if: steps.fixture.outcome == 'failure' || steps.focused.outcome == 'failure' || steps.button_trace.outcome == 'failure'
        run: exit 1
